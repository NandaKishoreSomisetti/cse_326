<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtMart — Digital Art Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="#" class="logo" data-view="shop">Art<span>Mart</span></a>
      <input type="search" id="search" class="search" data-i18n-ph="search" placeholder="Search art or artist...">
      <nav class="nav-links">
        <button class="link" data-view="shop" data-i18n="shop">Shop</button>
        <button class="link admin-only hidden" data-view="admin" data-i18n="admin">Admin</button>
        <select id="langSel" class="lang-select" title="Language"></select>
        <button class="link" id="themeBtn" title="Toggle theme">☀️</button>
        <button class="link" id="cartBtn"><span data-i18n="cart">Cart</span> <span class="badge" id="cartCount">0</span></button>
        <button class="btn btn-small" id="authBtn">Login</button>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- SHOP VIEW -->
    <section id="view-shop" class="view">
      <div class="hero" id="hero"></div>

      <div class="filters">
        <div class="pills" id="pills"></div>
        <div class="filter-row">
          <label><span data-i18n="maxPrice">Max price</span>: <strong id="priceLabel">$1000</strong>
            <input type="range" id="priceRange" min="50" max="1000" step="10" value="1000">
          </label>
          <select id="sort">
            <option value="featured" data-i18n="featured">Featured</option>
            <option value="low" data-i18n="low">Price: Low to High</option>
            <option value="high" data-i18n="high">Price: High to Low</option>
            <option value="rating" data-i18n="rating">Highest Rated</option>
          </select>
        </div>
      </div>

      <p class="muted" id="resultCount"></p>
      <div class="grid" id="grid"></div>
    </section>

    <!-- AUTH VIEW (shown first) -->
    <section id="view-auth" class="view hidden">
      <div class="card auth-card">
        <div class="tabs">
          <button class="tab active" data-tab="login" data-i18n="login">Login</button>
          <button class="tab" data-tab="register" data-i18n="register">Register</button>
        </div>

        <form id="loginForm" novalidate>
          <label><span data-i18n="email">Email</span> <input type="email" id="loginEmail"></label>
          <small class="error" id="loginEmailErr"></small>
          <label><span data-i18n="password">Password</span> <input type="password" id="loginPass"></label>
          <small class="error" id="loginPassErr"></small>
          <button class="btn full" type="submit" data-i18n="login">Login</button>
        </form>

        <form id="registerForm" class="hidden" novalidate>
          <label><span data-i18n="fullName">Full name</span> <input type="text" id="regName"></label>
          <small class="error" id="regNameErr"></small>
          <label><span data-i18n="email">Email</span> <input type="email" id="regEmail"></label>
          <small class="error" id="regEmailErr"></small>
          <label><span data-i18n="password">Password</span> <input type="password" id="regPass"></label>
          <small class="error" id="regPassErr"></small>
          <label><span data-i18n="confirmPass">Confirm password</span> <input type="password" id="regConfirm"></label>
          <small class="error" id="regConfirmErr"></small>
          <label><span data-i18n="role">Role</span>
            <select id="regRole">
              <option value="collector" data-i18n="collectorRole">Collector / Buyer</option>
              <option value="admin" data-i18n="adminRole">Admin / Curator</option>
            </select>
          </label>
          <button class="btn full" type="submit" data-i18n="createAccount">Create account</button>
        </form>

        <div class="demo">
          <p class="muted" data-i18n="demoLogin">Quick demo login:</p>
          <button class="btn btn-outline" data-demo="collector" data-i18n="collectorDemo">Collector demo</button>
          <button class="btn btn-outline" data-demo="admin" data-i18n="adminDemo">Admin demo</button>
        </div>
      </div>
    </section>

    <!-- ADMIN VIEW -->
    <section id="view-admin" class="view hidden">
      <div class="admin-head">
        <h2 data-i18n="adminDash">Admin Dashboard</h2>
        <div>
          <button class="btn btn-outline" id="resetBtn" data-i18n="resetData">Reset data</button>
          <button class="btn" id="addArtBtn" data-i18n="addArt">+ Add artwork</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th data-i18n="thArt">Artwork</th><th data-i18n="thCat">Category</th><th data-i18n="thPrice">Price</th><th data-i18n="featured">Featured</th><th data-i18n="thActions">Actions</th></tr>
          </thead>
          <tbody id="adminTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container" data-i18n="footer">© 2026 ArtMart · CSE 326 Project · HTML, CSS &amp; JavaScript</div>
  </footer>

  <!-- MODAL (detail / checkout / admin form / confirm) -->
  <div class="overlay hidden" id="modal">
    <div class="modal">
      <button class="close" data-close>&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- CART DRAWER -->
  <div class="overlay hidden" id="cartOverlay">
    <aside class="drawer">
      <div class="drawer-head">
        <h3 data-i18n="yourCart">Your Cart</h3>
        <button class="close" data-close-cart>&times;</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div class="cart-summary" id="cartSummary"></div>
    </aside>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
